<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeatherCheck</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      WeatherCheck
    </div>
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" placeholder="Search city or location...">
      <div class="autocomplete-dropdown" id="autocompleteDropdown" style="display: none;"></div>
    </div>
    <div class="header-icons">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <!-- <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>  
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>  -->
    </div>
  </header>

  <div class="top-row">
    <div class="card current-weather">
      <div class="cw-left">
        <div class="city">Chennai, Tamil Nadu</div>
        <div class="condition">Partly Cloudy</div>
        <div class="temp">31&deg;C</div>
        <div class="cw-meta">
          <span>&#127777; Feels like 34&deg;C</span>
          <span>&#128167; Humidity 72%</span>
          <span>&#128168; Wind 14km/h</span>
        </div>
      </div>
      <div class="cw-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </div>
    </div>

    <div class="card time-card">
      <div class="time" id="clock">10:09 AM</div>
      <div class="date">Monday, 24 June</div>
    </div>
  </div>

  <section>
    <h2>7-Day Forecast</h2>
    <div class="forecast-row" id="forecast"></div>
  </section>

  <section>
    <h2>Conditions</h2>
    <div class="conditions-row" id="conditions"></div>
  </section>

  <footer>
    <div>WeatherCheck</div>
    <div>&copy; 2026 WeatherCheck. Atmospheric Clarity Engine.</div>
    <div class="foot-links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
      <a href="#">API Access</a>
    </div>
  </footer>

</div>
<script src="./script.js"></script>
<script>
  const sunIcon = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
  const cloudIcon = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a5 5 0 1 1 1.3-9.8A6 6 0 0 1 22 12a4.5 4.5 0 0 1-4.5 4.5"/></svg>`;
  const rainIcon = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 13v8M8 13v8M12 15v8M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>`;

  const forecastData = [
    { label: "TODAY", icon: sunIcon, high: 32, low: 25, precip: 10, today: true },
    { label: "WED", icon: sunIcon, high: 34, low: 26, precip: 5 },
    { label: "THU", icon: cloudIcon, high: 30, low: 24, precip: 40 },
    { label: "FRI", icon: rainIcon, high: 28, low: 23, precip: 80 },
    { label: "SAT", icon: sunIcon, high: 30, low: 24, precip: 20 },
    { label: "SUN", icon: sunIcon, high: 33, low: 25, precip: 0 },
    { label: "MON", icon: sunIcon, high: 34, low: 28, precip: 0 },
  ];


  forecastData.forEach(d => {
    const div = document.createElement("div");
    div.className = "day-card" + (d.today ? " today" : "");
    div.innerHTML = `
      <div class="day-label">${d.label}</div>
      <div class="day-icon">${d.icon}</div>
      <div class="day-temp">${d.high}&deg; <span class="low">${d.low}&deg;</span></div>
      <div class="day-precip">&#128167; ${d.precip}%</div>
    `;
    forecastEl.appendChild(div);
  });

  const conditionsData = [
    { label: "SUNRISE", icon: "&#127749;", value: "05:58 AM" },
    { label: "SUNSET", icon: "&#127761;", value: "06:32 PM" },
    { label: "PRESSURE", icon: "&#128202;", value: "1012 hPa" },
    { label: "VISIBILITY", icon: "&#128065;", value: "8 km" },
    { label: "UV INDEX", icon: "&#9728;&#65039;", value: "6 (Mod)" },
    { label: "PRECIPITATION", icon: "&#127783;&#65039;", value: "0 mm" },
  ];


  conditionsData.forEach(c => {
    const div = document.createElement("div");
    div.className = "cond-card";
    div.innerHTML = `
      <div class="label">${c.icon} ${c.label}</div>
      <div class="value">${c.value}</div>
    `;
    conditionsEl.appendChild(div);
  });
</script>
</body>
</html>
